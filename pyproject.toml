[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensorgoat"
dynamic = ["version"]
description = "A vulnerable-by-design, scenario-based AI/ML security training ground for beginners. CPU only, fully local."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "machine-learning", "ctf", "adversarial-ml", "training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "safetensors>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "markdown-it-py>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
tensorgoat = "tensorgoat.cli:main"
tgoat = "tensorgoat.cli:main"

[tool.hatch.version]
path = "tensorgoat/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tensorgoat"]

# The walkthroughs travel with the package, so `tensorgoat walkthrough` and the
# web interface can show them on an install that has no repository checkout.
[tool.hatch.build.targets.wheel.force-include]
"solutions" = "tensorgoat/_solutions"

[tool.hatch.build.targets.sdist]
include = ["tensorgoat", "solutions", "tests", "scripts", "docker", "docs", "*.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # FastAPI's TestClient still imports httpx through Starlette.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Workspace assets are copied verbatim to the player and kept dependency-free.
"tensorgoat/scenarios/*/assets/*.py" = ["I"]
