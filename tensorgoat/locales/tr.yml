# TensorGoat komut satırı ve web arayüzü metinleri (Türkçe).
#
# Bu dosya İngilizce kataloğun (en.yml) çevirisidir. Düzenlerken yalnız iki
# nokta işaretinin sağındaki metin değiştirilir. Soldaki anahtarlar, {yer
# tutucular}, komut adları, bayrak biçimi ve [rich biçimleri] aynen kalır.
# Metin içindeki süslü parantez çift yazılır, {{ ve }} gibi.
# Terimler için docs/tr/sozluk.md, kurallar için docs/TRANSLATING.tr.md.

app:
  description: "TensorGoat, bilerek zafiyetli bırakılmış bir yapay zekâ ve makine öğrenmesi güvenliği alıştırma ortamıdır. Her şey bu bilgisayarda çalışır."
  fallback_note: "(bazı metinler henüz {lang} dilinde yok, İngilizce gösteriliyor)"

help:
  lang_option: "Yalnız bu komut için dil, örneğin tr."
