title: "Truva Süzgeci"
summary: "Zehirlenmiş eğitim verisinin bir spam süzgecine yerleştirdiği arka kapıyı bulunuz."
learning_objectives:
  - "Az miktarda yanlış etiketli eğitim verisi bir modele nasıl arka kapı yerleştirir."
  - "Veri kümesini basit sıklık istatistikleriyle denetleyerek arka kapı tetikleyicisini bulma."
  - "Verinin kaynağını bilmek ve veri kümesini gözden geçirmek neden birer güvenlik önlemidir."
