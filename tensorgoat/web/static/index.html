<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>TensorGoat</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 3 27 9.5v13L16 29 5 22.5v-13z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="16" cy="11" r="2.2" fill="currentColor"/>
      <circle cx="10.5" cy="20" r="2.2" fill="currentColor"/>
      <circle cx="21.5" cy="20" r="2.2" fill="currentColor"/>
      <path d="M16 11 10.5 20h11z" fill="none" stroke="currentColor" stroke-width="1.4"/>
    </svg>
    <span class="brand-name">TensorGoat</span>
    <span class="brand-version" id="version"></span>
  </a>
  <div class="topbar-right">
    <span class="local-badge" data-i18n="local_only"></span>
    <div class="progress" id="progress" hidden>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-text" id="progress-text"></span>
    </div>
    <div class="lang-switch" id="lang-switch" role="group"></div>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" aria-labelledby="sidebar-title">
    <a class="nav-home" href="#/" id="nav-home" data-i18n="home"></a>
    <h2 class="sidebar-title" id="sidebar-title" data-i18n="scenarios"></h2>
    <ol class="scenario-list" id="scenario-list"></ol>
  </nav>
  <main class="main" id="main" tabindex="-1">
    <p class="loading" data-i18n="loading"></p>
  </main>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>window.TGOAT_TOKEN = "__TGOAT_TOKEN__";</script>
<script src="/static/app.js"></script>
</body>
</html>
